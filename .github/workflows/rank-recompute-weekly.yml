name: rank-recompute-weekly

on:
  schedule:
    - cron: "15 4 * * 1"
  workflow_dispatch:
    inputs:
      timeframe:
        description: "Leaderboard timeframe to recompute"
        required: false
        default: "weekly"
        type: choice
        options:
          - weekly
          - daily
          - monthly
          - all_time
      limit:
        description: "Maximum boards to scan"
        required: false
        default: "200"
        type: number
      determinismProbeCount:
        description: "How many rebuilt boards to probe for repeated-run determinism"
        required: false
        default: "3"
        type: number

permissions:
  contents: read
  issues: write

jobs:
  recompute:
    runs-on: ubuntu-latest
    concurrency:
      group: rank-recompute-weekly
      cancel-in-progress: false
    env:
      DEFAULT_TIMEFRAME: weekly
      DEFAULT_LIMIT: "200"
      DEFAULT_DETERMINISM_PROBE_COUNT: "3"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve parameters
        id: params
        shell: bash
        run: |
          timeframe="${{ github.event.inputs.timeframe }}"
          limit="${{ github.event.inputs.limit }}"
          probe="${{ github.event.inputs.determinismProbeCount }}"

          if [ -z "$timeframe" ]; then timeframe="$DEFAULT_TIMEFRAME"; fi
          if [ -z "$limit" ]; then limit="$DEFAULT_LIMIT"; fi
          if [ -z "$probe" ]; then probe="$DEFAULT_DETERMINISM_PROBE_COUNT"; fi

          echo "timeframe=$timeframe" >> "$GITHUB_OUTPUT"
          echo "limit=$limit" >> "$GITHUB_OUTPUT"
          echo "probe=$probe" >> "$GITHUB_OUTPUT"

      - name: Validate required secrets
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          missing=()
          if [ -z "${SUPABASE_URL:-}" ]; then missing+=("SUPABASE_URL"); fi
          if [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then missing+=("SUPABASE_SERVICE_ROLE_KEY"); fi

          if [ "${#missing[@]}" -gt 0 ]; then
            MISSING_SECRETS="$(IFS=,; echo "${missing[*]}")" node <<'NODE'
          const { writeFileSync } = require("node:fs");

          const missingSecrets = process.env.MISSING_SECRETS.split(",").filter(Boolean);
          const report = {
            status: "configuration_error",
            requestedAt: new Date().toISOString(),
            runId: process.env.GITHUB_RUN_ID,
            eventName: process.env.GITHUB_EVENT_NAME,
            missingSecrets,
            message: "The rank recompute did not run because required Actions secrets are missing."
          };

          writeFileSync("rank-recompute-report.json", `${JSON.stringify(report, null, 2)}\n`);
          NODE
            echo "Missing required repo secrets: ${missing[*]}." >&2
            exit 1
          fi

      - name: Run weekly recompute
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node scripts/run-rank-recompute-weekly.mjs \
            --timeframe "${{ steps.params.outputs.timeframe }}" \
            --limit "${{ steps.params.outputs.limit }}" \
            --determinism-probe-count "${{ steps.params.outputs.probe }}" \
            --output-file rank-recompute-report.json

      - name: Upload recompute report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rank-recompute-report-${{ github.run_id }}
          path: rank-recompute-report.json

      - name: Create ops alert issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const runUrl = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;
            const canonicalIssueNumber = 103;
            const title = `[OPS] Rank recompute failed (${new Date().toISOString().slice(0, 10)})`;
            const body = [
              "Rank recompute scheduler reported a failure.",
              `- Workflow run: ${runUrl}`,
              `- Trigger: ${context.eventName}`,
              `- Commit: ${context.sha}`,
              "",
              "Inspect the `rank-recompute-report` workflow artifact for detailed diagnostics."
            ].join("\n");

            try {
              const { data: canonicalIssue } = await github.rest.issues.get({
                owner,
                repo,
                issue_number: canonicalIssueNumber
              });

              if (canonicalIssue.state === "open") {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: canonicalIssueNumber,
                  body
                });
                return;
              }
            } catch (error) {
              core.warning(`Unable to update canonical issue #${canonicalIssueNumber}: ${error.message}`);
            }

            await github.rest.issues.create({
              owner,
              repo,
              title,
              body,
              labels: ["high-priority", "phase-7"]
            });
